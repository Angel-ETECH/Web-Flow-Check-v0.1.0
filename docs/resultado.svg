<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 276" role="img" aria-labelledby="title">
  <title id="title">Tres ejemplos de comprobaciones: abrir una ficha, rechazar una fecha pasada y filtrar una tabla.</title>
  <rect x="1" y="1" width="1038" height="274" rx="19" fill="#F0F5F1" stroke="#D2DDD5" stroke-width="2"/>
  <text x="38" y="46" fill="#45635A" font-family="monospace" font-size="15" letter-spacing="2">EJEMPLOS DE COMPROBACIONES</text>
  <path d="M38 69h964m-964 58h964m-964 58h964" stroke="#CEDBD3"/>
  <g fill="#45635A" font-family="monospace" font-size="15">
    <text x="38" y="104">01 / NAVEGACIÓN</text>
    <text x="38" y="162">02 / VALIDACIÓN</text>
    <text x="38" y="220">03 / FILTROS</text>
  </g>
  <g fill="#142724" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">
    <text x="270" y="105">El enlace abre la ficha del proyecto seleccionado.</text>
    <text x="270" y="163">El formulario rechaza una fecha pasada.</text>
    <text x="270" y="221">La tabla muestra solo los registros del estado elegido.</text>
  </g>
</svg>